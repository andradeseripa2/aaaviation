<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0E2954"/>
      <stop offset="100%" stop-color="#07122A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Badge Background for High Visibility in Tabs (Dark & Light browser mode) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Swept Aerodynamic Wings (Left & Right) -->
  <!-- Left Lower Wing -->
  <path d="M256 310 L70 340 C130 315 190 285 245 270 Z" fill="#132D6B" opacity="0.9"/>
  <!-- Left Middle Wing -->
  <path d="M256 280 L110 295 C160 275 210 250 248 238 Z" fill="url(#blueGrad)"/>
  <!-- Left Top High-Speed Wing -->
  <path d="M256 250 L150 260 C190 242 230 220 250 205 Z" fill="url(#skyGrad)"/>

  <!-- Right Lower Wing -->
  <path d="M256 310 L442 340 C382 315 322 285 267 270 Z" fill="#132D6B" opacity="0.9"/>
  <!-- Right Middle Wing -->
  <path d="M256 280 L402 295 C352 275 302 250 264 238 Z" fill="url(#blueGrad)"/>
  <!-- Right Top High-Speed Wing -->
  <path d="M256 250 L362 260 C322 242 282 220 262 205 Z" fill="url(#skyGrad)"/>

  <!-- Supersonic Jet Silhouette & Climbing Flightpath -->
  <g filter="url(#glow)">
    <!-- Jet Fuselage & Delta Wings -->
    <path d="M256 120 L270 210 L330 250 L274 250 L282 320 L256 304 L230 320 L238 250 L182 250 L242 210 Z" fill="#FFFFFF"/>
    <!-- Gold Jet Canopy / Core Accents -->
    <path d="M256 140 L263 195 L256 215 L249 195 Z" fill="url(#goldGrad)"/>
    <!-- Jet Afterburner Trail -->
    <ellipse cx="256" cy="316" rx="6" ry="12" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden Flight Horizon Arc -->
  <path d="M100 370 Q256 320 412 370" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- AAA Monogram Aviation Lettering -->
  <text x="256" y="426" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">AAA</text>
  <text x="256" y="456" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">AVIATION</text>
</svg>
