[build]
  publish = "dist"
  command = "npm run build"

# Netlify Caching & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets with immutable cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sem redirecionamento global para a home. Os redirecionamentos ficam em
# public/_redirects (gravado também pelo gerador em dist/): as telas que só
# existem no app caem no casco, e qualquer endereço inexistente recebe o
# 404.html com status 404 — antes, tudo respondia 200 com a home.
