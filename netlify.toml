[build]
  publish = "dist"
  command = "npm run build"

# Netlify Caching & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets with immutable cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files generated by SSG (e.g. /sobre/index.html, /post/*/index.html) are served automatically.
# The rule below acts as SPA fallback for any uncached client navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
